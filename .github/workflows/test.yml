name: Validate extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check src/js/strave_kudos.js
          node --check scripts/build.js
          node --check scripts/release.js
      - name: Run behavior and build tests
        run: npm test
      - name: Build validation packages
        run: npm run build -- --firefox-id ci-validation@example.org --output-dir "$RUNNER_TEMP/browser-builds"
      - name: Lint the packaged Firefox extension
        run: |
          unzip "$RUNNER_TEMP/browser-builds/firefox.zip" -d "$RUNNER_TEMP/firefox"
          npm exec --offline -- web-ext lint --source-dir "$RUNNER_TEMP/firefox"
      - name: Save validated packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-packages
          path: ${{ runner.temp }}/browser-builds/*.zip
          if-no-files-found: error
          retention-days: 7
