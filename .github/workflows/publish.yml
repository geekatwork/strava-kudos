name: Build and submit Chrome release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate: no credentials; check: read store status; submit: upload for review'
        type: choice
        options: [validate, check, submit]
        default: validate
        required: true
      stores:
        description: 'Selected stores (only chrome is currently supported)'
        type: string
        default: chrome
        required: true

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      chrome_mode: ${{ steps.plan.outputs.chrome_mode }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      FIREFOX_ADDON_ID: ${{ vars.FIREFOX_ADDON_ID }}
    steps:
      - name: Set release output directory
        run: printf 'RELEASE_OUTPUT_DIR=%s/release-builds\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Validate release command
        id: plan
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_STORES: ${{ inputs.stores }}
        run: node scripts/release-plan.js
      - name: Validate release tag and configuration
        run: node scripts/release.js validate
      - name: Check JavaScript syntax
        run: |
          node --check src/js/strave_kudos.js
          node --check scripts/build.js
          node --check scripts/release.js
          node --check scripts/chrome-store.js
          node --check scripts/release-plan.js
      - name: Run behavior and packaging tests
        run: npm test
      - name: Build and verify release archives from tagged source
        run: node scripts/release.js build
      - name: Lint packaged Firefox extension
        run: |
          unzip "$RELEASE_OUTPUT_DIR/firefox.zip" -d "$RUNNER_TEMP/release-firefox"
          npm exec --offline -- web-ext lint --source-dir "$RUNNER_TEMP/release-firefox"
      - name: Save validated release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-${{ github.ref_name }}
          path: ${{ env.RELEASE_OUTPUT_DIR }}/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Summarize release validation
        run: |
          printf '### Validated release: %s\n\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf 'Chromium and Firefox packages rebuilt, verified and linted. No store upload or signing was performed.\n' >> "$GITHUB_STEP_SUMMARY"

  chrome-store:
    needs: build-release
    if: >-
      needs.build-release.result == 'success' &&
      needs.build-release.outputs.chrome_mode != 'none' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Download validated release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-packages-${{ github.ref_name }}
          path: ${{ runner.temp }}/chrome-package
      - name: Check authentication or submit release
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CHROMIUM_PACKAGE: ${{ runner.temp }}/chrome-package/chromium.zip
          CWS_AUTO_SUBMIT: ${{ vars.CWS_AUTO_SUBMIT }}
          CHROME_MODE: ${{ needs.build-release.outputs.chrome_mode }}
        run: |
          if [ "$CHROME_MODE" = "auto" ]; then
            case "$CWS_AUTO_SUBMIT" in
              ""|false) CHROME_MODE=check ;;
              true) CHROME_MODE=submit ;;
              *) echo "CWS_AUTO_SUBMIT must be true, false, or unset." >&2; exit 1 ;;
            esac
          fi
          case "$CHROME_MODE" in
            check|submit) node scripts/chrome-store.js "$CHROME_MODE" ;;
            *) echo "Invalid Chrome release mode." >&2; exit 1 ;;
          esac
